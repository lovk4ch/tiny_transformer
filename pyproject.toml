[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-transformer"
version = "0.1.0"
description = "Tiny Transformer implementation in PyTorch"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "tqdm",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tiny-transformer = "tiny_transformer.main:main"